<div class="ui-select" [class.is-open]="isOpen">
  <button
    type="button"
    class="ui-select__button"
    [attr.aria-label]="ariaLabel"
    [attr.aria-expanded]="isOpen"
    (click)="toggle()"
    (keydown)="onButtonKeydown($event)"
  >
    <span>{{ selectedLabel() }}</span>
    <i aria-hidden="true"></i>
  </button>

  @if (isOpen) {
    <div class="ui-select__menu" role="listbox">
      @for (option of options; track option.id) {
        <button
          type="button"
          class="ui-select__option"
          role="option"
          [class.is-selected]="option.id === value"
          [disabled]="option.disabled"
          [attr.aria-selected]="option.id === value"
          (click)="choose(option)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
